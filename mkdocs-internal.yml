site_name: "Documentation Appliance – MkDocs INTERNAL"
site_description: "INTERNAL ONLY – Sensitive content enabled"
site_author: "Your Organisation"
site_url: "http://localhost/mkdocs-internal/"
docs_dir: docs
site_dir: site_internal
use_directory_urls: true

# Navigation remains identical
nav:
  - Home: index.md
  - Products:
      - Overview: products/index.md
      - Common Platform: products/common/platform.md
      - He (Ultra-Low-Power):
          - Getting Started: products/he/getting-started.md
      - Ne (Multi-Protocol):
          - Getting Started: products/ne/getting-started.md
      - Yo (Edge Computing):
          - Getting Started: products/yo/getting-started.md
  - Demo:
      - Welcome: demo/index.md
      - Register Comparison: demo/register_demo.md
      - Tags Demonstration: demo/tags_test.md
      - Introduction: demo/Introduction.md
  - Technical Documents - Layer 1:
      - demo/Level1/testAvani.md
  - Technical Documents - Layer 2:
      - demo/Level2/testAvanicopy2.md
      - demo/Level2/testAvanicopy.md
      - demo/Level2/testAvani.md
  - Setup Instructions: demo/SetupInstructions.md

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide

plugins:
  - search:
      lang: en
  - tags
  - section-index
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
  - include-markdown
  - macros:
      include_yaml:
        - docs/assets/variables.yml

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ["docs"]
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - abbr
  - meta
  - toc:
      permalink: true
      toc_depth: 3

# This is the key difference – we enable the 'internal' flag for macros
extra:
  internal: true
