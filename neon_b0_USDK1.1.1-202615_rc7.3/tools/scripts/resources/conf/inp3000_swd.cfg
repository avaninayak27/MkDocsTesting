 #FTDI                     Helium
# ----                     ------
# GND    ----------------- GND
# TDI    ---/\220 Ohm/\--- SWDIO
# TDO    ----------------- SWDIO
# TCK    ----------------- SWCLK
# TMS    - NC

adapter name
adapter driver ftdi

#FTDI_SERIAL value is passed as set argument to openocd command, 
	#For Example: openocd -s ./conf -c 'set FTDI_SERIAL 30005015' -c 'tcl_port 6666' -c 'telnet_port 6667' -c 'gdb_port 3333' -f inp3000_swd.cfg -f t3a_ftdi_swd.cfg
ftdi_serial $FTDI_SERIAL

ftdi_vid_pid 0x0403 0x6011
ftdi_layout_init 0x0078 0x05fb
ftdi_layout_signal nSRST -ndata 0x0080 -oe 0x80
ftdi_layout_signal SWD_EN -data 0

