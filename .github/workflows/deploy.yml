name: Deploy Documentation

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-section-index mkdocs-glightbox mkdocs-minify-plugin mkdocs-awesome-pages-plugin mkdocs-git-revision-date-localized-plugin

      - name: Build Internal Site
        run: |
          if [ -f "mkdocs-internal.yml" ]; then
            mkdocs build -f mkdocs-internal.yml
          else
            echo "Internal config not found, skipping."
          fi